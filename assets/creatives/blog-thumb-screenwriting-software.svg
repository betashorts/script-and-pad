<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multiple screenwriting software windows with gold star badge illustration">
  <rect width="380" height="200" fill="#162032"/>
  <!-- Depth circles -->
  <circle cx="185" cy="100" r="125" fill="#1e2f45" fill-opacity="0.55"/>
  <circle cx="340" cy="45" r="65" fill="#253652" fill-opacity="0.45"/>
  <!-- Radial glow -->
  <circle cx="200" cy="95" r="88" fill="#c9a84c" fill-opacity="0.05"/>

  <!-- Screen / window 3 (back left, rotated) -->
  <g transform="rotate(-8 120 100)">
    <rect x="48" y="52" width="100" height="72" rx="6" fill="#0d1b2a"/>
    <rect x="48" y="52" width="100" height="14" rx="6" fill="#253652"/>
    <rect x="48" y="60" width="100" height="6" rx="0" fill="#253652"/>
    <!-- Window dots -->
    <circle cx="57" cy="59" r="3" fill="#c0533a" opacity="0.7"/>
    <circle cx="66" cy="59" r="3" fill="#c9a84c" opacity="0.7"/>
    <circle cx="75" cy="59" r="3" fill="#2a7f7f" opacity="0.7"/>
    <!-- Script lines -->
    <rect x="58" y="76" width="36" height="2" rx="1" fill="#3d5166" opacity="0.6"/>
    <rect x="58" y="82" width="48" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="58" y="88" width="30" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="58" y="94" width="52" height="2" rx="1" fill="#3d5166" opacity="0.45"/>
    <rect x="58" y="100" width="40" height="2" rx="1" fill="#3d5166" opacity="0.45"/>
    <rect x="58" y="106" width="34" height="2" rx="1" fill="#3d5166" opacity="0.4"/>
  </g>

  <!-- Screen / window 2 (back right, rotated) -->
  <g transform="rotate(6 270 100)">
    <rect x="220" y="48" width="100" height="72" rx="6" fill="#0d1b2a"/>
    <rect x="220" y="48" width="100" height="14" rx="6" fill="#253652"/>
    <rect x="220" y="56" width="100" height="6" rx="0" fill="#253652"/>
    <circle cx="229" cy="55" r="3" fill="#c0533a" opacity="0.7"/>
    <circle cx="238" cy="55" r="3" fill="#c9a84c" opacity="0.7"/>
    <circle cx="247" cy="55" r="3" fill="#2a7f7f" opacity="0.7"/>
    <rect x="230" y="72" width="38" height="2" rx="1" fill="#3d5166" opacity="0.6"/>
    <rect x="230" y="78" width="52" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="230" y="84" width="28" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="230" y="90" width="44" height="2" rx="1" fill="#3d5166" opacity="0.45"/>
    <rect x="230" y="96" width="36" height="2" rx="1" fill="#3d5166" opacity="0.4"/>
    <rect x="230" y="102" width="50" height="2" rx="1" fill="#3d5166" opacity="0.4"/>
  </g>

  <!-- Screen / window 1 (FRONT, center, highlighted — Screenplay Writer) -->
  <rect x="126" y="36" width="128" height="92" rx="7" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1.8" stroke-opacity="0.7"/>
  <rect x="126" y="36" width="128" height="17" rx="7" fill="#1e2f45"/>
  <rect x="126" y="47" width="128" height="6" rx="0" fill="#1e2f45"/>
  <circle cx="137" cy="45" r="3.5" fill="#c0533a" opacity="0.8"/>
  <circle cx="147" cy="45" r="3.5" fill="#c9a84c" opacity="0.8"/>
  <circle cx="157" cy="45" r="3.5" fill="#2a7f7f" opacity="0.8"/>
  <!-- "Screenplay Writer" label in window -->
  <text x="190" y="62" fill="#c9a84c" font-size="6" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" opacity="0.9">Screenplay Writer</text>
  <!-- Script content (formatted) -->
  <text x="140" y="79" fill="#c9a84c" font-size="5.5" font-family="monospace" opacity="0.85">INT. COFFEE SHOP - DAY</text>
  <rect x="140" y="85" width="56" height="1.8" rx="1" fill="#f5f0e8" opacity="0.45"/>
  <rect x="140" y="90" width="80" height="1.8" rx="1" fill="#f5f0e8" opacity="0.4"/>
  <rect x="140" y="95" width="62" height="1.8" rx="1" fill="#f5f0e8" opacity="0.4"/>
  <!-- Dialogue block -->
  <rect x="166" y="102" width="40" height="1.8" rx="1" fill="#c9a84c" opacity="0.5"/>
  <rect x="152" y="108" width="68" height="1.8" rx="1" fill="#f5f0e8" opacity="0.38"/>
  <rect x="152" y="113" width="52" height="1.8" rx="1" fill="#f5f0e8" opacity="0.35"/>
  <rect x="152" y="118" width="60" height="1.8" rx="1" fill="#f5f0e8" opacity="0.3"/>

  <!-- Gold star badge on front window (top-right corner) -->
  <circle cx="245" cy="46" r="14" fill="#c9a84c"/>
  <text x="245" y="50" fill="#0d1b2a" font-size="13" text-anchor="middle" font-weight="900">★</text>

  <!-- Small character below screens -->
  <!-- Body -->
  <rect x="158" y="148" width="40" height="36" rx="10" fill="#2a7f7f"/>
  <!-- Head -->
  <circle cx="178" cy="138" r="14" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M164 133 Q166 122 178 120 Q190 122 192 133 Q187 125 178 123 Q169 125 164 133Z" fill="#3d2b1f"/>
  <!-- Eyes comparing left and right -->
  <circle cx="173" cy="137" r="1.8" fill="#2c3e50"/>
  <circle cx="183" cy="137" r="1.8" fill="#2c3e50"/>
  <!-- Thinking look -->
  <path d="M173 143 Q178 147 183 143" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arms gesturing wide (comparing) -->
  <path d="M162 156 Q140 148 122 144" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="122" cy="144" r="6" fill="#d4956a"/>
  <path d="M194 156 Q216 148 234 144" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="234" cy="144" r="6" fill="#d4956a"/>
  <!-- Legs -->
  <path x1="170" y1="184" x2="167" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="184" x2="167" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>
  <line x1="186" y1="184" x2="189" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>

  <!-- Stars -->
  <text x="18" y="36" fill="#c9a84c" font-size="14" opacity="0.45">★</text>
  <text x="348" y="185" fill="#c9a84c" font-size="12" opacity="0.42">★</text>
  <!-- Dots -->
  <circle cx="356" cy="30" r="3" fill="#c9a84c" opacity="0.4"/>
  <circle cx="18" cy="180" r="3" fill="#2a7f7f" opacity="0.5"/>
</svg>
