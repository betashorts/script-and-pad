<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#1e2f45"/>
  <!-- Depth circles -->
  <circle cx="310" cy="170" r="130" fill="#253652" opacity="0.6"/>
  <circle cx="50" cy="30" r="85" fill="#0d1b2a" opacity="0.7"/>
  <!-- Glow behind monitor -->
  <circle cx="190" cy="80" r="90" fill="#c9a84c" opacity="0.05"/>

  <!-- Monitor shape -->
  <rect x="60" y="20" width="260" height="150" rx="8" fill="#0d1b2a" stroke="#253652" stroke-width="2"/>
  <rect x="65" y="25" width="250" height="140" rx="5" fill="#162032"/>
  <!-- Monitor stand -->
  <rect x="178" y="170" width="24" height="18" rx="3" fill="#253652"/>
  <rect x="160" y="185" width="60" height="8" rx="4" fill="#253652"/>

  <!-- Editing timeline inside screen -->
  <!-- Timeline background -->
  <rect x="70" y="100" width="240" height="56" rx="3" fill="#0d1b2a"/>
  <!-- Track labels -->
  <rect x="70" y="100" width="30" height="14" rx="2" fill="#1e2f45"/>
  <rect x="70" y="116" width="30" height="12" rx="2" fill="#1e2f45"/>
  <rect x="70" y="130" width="30" height="12" rx="2" fill="#1e2f45"/>
  <rect x="70" y="144" width="30" height="12" rx="2" fill="#1e2f45"/>

  <!-- Timeline clips row 1 (video) - navy/gold/teal -->
  <rect x="102" y="101" width="50" height="12" rx="2" fill="#2a7f7f"/>
  <rect x="155" y="101" width="38" height="12" rx="2" fill="#c9a84c"/>
  <rect x="196" y="101" width="62" height="12" rx="2" fill="#253652" stroke="#c9a84c" stroke-width="0.8"/>
  <rect x="261" y="101" width="45" height="12" rx="2" fill="#2a7f7f"/>

  <!-- Timeline clips row 2 (b-roll) -->
  <rect x="102" y="117" width="30" height="11" rx="2" fill="#162032" stroke="#2a7f7f" stroke-width="0.8"/>
  <rect x="136" y="117" width="55" height="11" rx="2" fill="#1e2f45" stroke="#c9a84c" stroke-width="0.8"/>
  <rect x="196" y="117" width="40" height="11" rx="2" fill="#162032" stroke="#2a7f7f" stroke-width="0.8"/>
  <rect x="240" y="117" width="66" height="11" rx="2" fill="#1e2f45" stroke="#c9a84c" stroke-width="0.8"/>

  <!-- Timeline clips row 3 (audio 1) -->
  <rect x="102" y="131" width="204" height="11" rx="2" fill="#253652"/>
  <!-- Audio waveform hint -->
  <rect x="108" y="133" width="4" height="7" rx="1" fill="#c9a84c" opacity="0.6"/>
  <rect x="114" y="135" width="4" height="4" rx="1" fill="#c9a84c" opacity="0.6"/>
  <rect x="120" y="132" width="4" height="9" rx="1" fill="#c9a84c" opacity="0.6"/>
  <rect x="126" y="134" width="4" height="5" rx="1" fill="#c9a84c" opacity="0.6"/>
  <rect x="132" y="133" width="4" height="7" rx="1" fill="#c9a84c" opacity="0.6"/>
  <rect x="138" y="135" width="4" height="4" rx="1" fill="#c9a84c" opacity="0.6"/>

  <!-- Timeline clips row 4 (audio 2) -->
  <rect x="102" y="145" width="204" height="11" rx="2" fill="#1e2f45"/>

  <!-- Playhead (gold vertical line) -->
  <line x1="196" y1="97" x2="196" y2="159" stroke="#c9a84c" stroke-width="2"/>
  <polygon points="190,97 202,97 196,104" fill="#c9a84c"/>

  <!-- Colour grading wheel hint (top right of screen) -->
  <!-- Colour circle -->
  <circle cx="298" cy="62" r="28" fill="#162032" stroke="#253652" stroke-width="1.5"/>
  <!-- Colour segments simplified -->
  <path d="M298,62 L298,34 A28,28 0 0,1 326,62 Z" fill="#c0533a" opacity="0.5"/>
  <path d="M298,62 L326,62 A28,28 0 0,1 298,90 Z" fill="#c9a84c" opacity="0.5"/>
  <path d="M298,62 L298,90 A28,28 0 0,1 270,62 Z" fill="#2a7f7f" opacity="0.5"/>
  <path d="M298,62 L270,62 A28,28 0 0,1 298,34 Z" fill="#253652" opacity="0.5"/>
  <!-- Centre hub -->
  <circle cx="298" cy="62" r="9" fill="#162032"/>
  <circle cx="298" cy="62" r="4" fill="#c9a84c" opacity="0.8"/>

  <!-- Media pool area top left of screen -->
  <rect x="70" y="30" width="60" height="65" rx="3" fill="#0d1b2a"/>
  <rect x="73" y="33" width="54" height="10" rx="2" fill="#1e2f45"/>
  <text x="100" y="41" font-family="Arial,sans-serif" font-size="6" fill="#c9a84c" text-anchor="middle">MEDIA POOL</text>
  <rect x="73" y="46" width="22" height="16" rx="2" fill="#253652"/>
  <rect x="98" y="46" width="22" height="16" rx="2" fill="#2c3e50"/>
  <rect x="73" y="65" width="22" height="16" rx="2" fill="#1e2f45"/>
  <rect x="98" y="65" width="22" height="16" rx="2" fill="#253652"/>
  <!-- Small film frames inside thumbnails -->
  <rect x="75" y="48" width="18" height="12" rx="1" fill="#162032"/>
  <rect x="100" y="48" width="18" height="12" rx="1" fill="#162032"/>

  <!-- Page tabs at bottom of screen -->
  <rect x="70" y="158" width="30" height="7" rx="2" fill="#162032"/>
  <rect x="103" y="158" width="22" height="7" rx="2" fill="#c9a84c"/>
  <rect x="128" y="158" width="22" height="7" rx="2" fill="#162032"/>
  <rect x="153" y="158" width="28" height="7" rx="2" fill="#162032"/>
  <rect x="184" y="158" width="28" height="7" rx="2" fill="#162032"/>
  <rect x="215" y="158" width="30" height="7" rx="2" fill="#162032"/>
  <rect x="248" y="158" width="28" height="7" rx="2" fill="#162032"/>
  <text x="114" y="163" font-family="Arial,sans-serif" font-size="5" fill="#0d1b2a" text-anchor="middle" font-weight="bold">EDIT</text>

  <!-- FREE badge -->
  <rect x="280" y="158" width="36" height="14" rx="6" fill="#2a7f7f"/>
  <text x="298" y="168" font-family="Arial,sans-serif" font-size="8" fill="#f5f0e8" text-anchor="middle" font-weight="bold">FREE</text>

  <!-- Flat character at desk -->
  <!-- Desk -->
  <rect x="20" y="172" width="80" height="8" rx="3" fill="#253652"/>
  <!-- Body -->
  <rect x="28" y="148" width="26" height="28" rx="10" fill="#c9a84c"/>
  <!-- Legs (seated) -->
  <rect x="31" y="172" width="8" height="14" rx="4" fill="#1e2f45"/>
  <rect x="43" y="172" width="8" height="14" rx="4" fill="#1e2f45"/>
  <!-- Head -->
  <circle cx="41" cy="140" r="13" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M28 135 Q41 122 54 135 L54 128 Q41 115 28 128 Z" fill="#253652"/>
  <!-- Eye (looking at screen) -->
  <circle cx="46" cy="141" r="2.2" fill="#0d1b2a"/>
  <!-- Arm on mouse -->
  <path d="M54 158 Q62 164 70 168" stroke="#d4956a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Mouse -->
  <rect x="68" y="165" width="10" height="13" rx="5" fill="#253652"/>
  <!-- Other arm on keyboard -->
  <path d="M28 158 Q22 164 18 168" stroke="#d4956a" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Gold stars -->
  <text x="336" y="24" font-family="Arial,sans-serif" font-size="16" fill="#c9a84c" opacity="0.45">★</text>
  <text x="22" y="192" font-family="Arial,sans-serif" font-size="14" fill="#c9a84c" opacity="0.4">★</text>
</svg>
