<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#0d1b2a"/>

  <!-- Depth circles -->
  <circle cx="190" cy="220" r="150" fill="#162032" opacity="0.6"/>
  <circle cx="20" cy="30" r="80" fill="#162032" opacity="0.4"/>

  <!-- Radial spotlight from top -->
  <polygon fill="#c9a84c" opacity="0.06" points="190,0 80,200 300,200"/>

  <!-- Pipeline boxes: 4 boxes connected by gold arrows -->
  <!-- Box 1: Script (brightest, gold border) -->
  <rect x="18" y="60" width="64" height="72" rx="6" fill="#1e2f45"/>
  <rect x="18" y="60" width="64" height="72" rx="6" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <!-- Script icon inside box 1 -->
  <rect x="30" y="72" width="40" height="50" rx="2" fill="#f5f0e8" opacity="0.9"/>
  <rect x="34" y="78" width="32" height="3" rx="1" fill="#c9a84c" opacity="0.9"/>
  <rect x="34" y="84" width="28" height="2" rx="1" fill="#253652" opacity="0.7"/>
  <rect x="34" y="89" width="30" height="2" rx="1" fill="#253652" opacity="0.7"/>
  <rect x="34" y="94" width="22" height="2" rx="1" fill="#253652" opacity="0.6"/>
  <rect x="34" y="101" width="24" height="2" rx="1" fill="#253652" opacity="0.6"/>
  <rect x="34" y="106" width="28" height="2" rx="1" fill="#253652" opacity="0.6"/>
  <rect x="34" y="111" width="20" height="2" rx="1" fill="#253652" opacity="0.5"/>
  <!-- Label -->
  <text x="50" y="148" text-anchor="middle" fill="#c9a84c" font-size="9" font-family="sans-serif" font-weight="bold">Script</text>

  <!-- Arrow 1→2 -->
  <line x1="84" y1="96" x2="104" y2="96" stroke="#c9a84c" stroke-width="2"/>
  <polygon points="104,91 114,96 104,101" fill="#c9a84c"/>

  <!-- Box 2: Pre-Prod (clapperboard) -->
  <rect x="116" y="60" width="64" height="72" rx="6" fill="#1e2f45"/>
  <!-- Clapperboard -->
  <rect x="128" y="70" width="40" height="32" rx="3" fill="#253652"/>
  <rect x="128" y="70" width="40" height="11" rx="3" fill="#162032"/>
  <line x1="136" y1="70" x2="132" y2="81" stroke="#c9a84c" stroke-width="2"/>
  <line x1="144" y1="70" x2="140" y2="81" stroke="#c9a84c" stroke-width="2"/>
  <line x1="152" y1="70" x2="148" y2="81" stroke="#c9a84c" stroke-width="2"/>
  <rect x="131" y="86" width="24" height="2" rx="1" fill="#3d5166" opacity="0.8"/>
  <rect x="131" y="91" width="28" height="2" rx="1" fill="#3d5166" opacity="0.7"/>
  <rect x="131" y="96" width="20" height="2" rx="1" fill="#3d5166" opacity="0.6"/>
  <text x="148" y="148" text-anchor="middle" fill="#e8c96a" font-size="8" font-family="sans-serif">Pre-Prod</text>

  <!-- Arrow 2→3 -->
  <line x1="182" y1="96" x2="202" y2="96" stroke="#c9a84c" stroke-width="2"/>
  <polygon points="202,91 212,96 202,101" fill="#c9a84c"/>

  <!-- Box 3: Production (camera) -->
  <rect x="214" y="60" width="64" height="72" rx="6" fill="#1e2f45"/>
  <!-- Camera body -->
  <rect x="224" y="80" width="36" height="24" rx="4" fill="#2c3e50"/>
  <!-- Camera lens -->
  <circle cx="242" cy="92" r="9" fill="#162032"/>
  <circle cx="242" cy="92" r="6" fill="#253652"/>
  <circle cx="242" cy="92" r="3" fill="#0d1b2a"/>
  <circle cx="244" cy="90" r="1" fill="#c9a84c" opacity="0.6"/>
  <!-- Viewfinder bump -->
  <rect x="252" y="76" width="12" height="8" rx="2" fill="#253652"/>
  <text x="246" y="148" text-anchor="middle" fill="#e8c96a" font-size="8" font-family="sans-serif">Production</text>

  <!-- Arrow 3→4 -->
  <line x1="280" y1="96" x2="300" y2="96" stroke="#c9a84c" stroke-width="2"/>
  <polygon points="300,91 310,96 300,101" fill="#c9a84c"/>

  <!-- Box 4: Screen (film reel) -->
  <rect x="312" y="60" width="56" height="72" rx="6" fill="#1e2f45"/>
  <!-- Film reel -->
  <circle cx="340" cy="92" r="22" fill="#162032" stroke="#c9a84c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="340" cy="92" r="8" fill="#253652"/>
  <circle cx="340" cy="92" r="3" fill="#162032"/>
  <line x1="340" y1="70" x2="340" y2="78" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="340" y1="106" x2="340" y2="114" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="318" y1="92" x2="326" y2="92" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="354" y1="92" x2="362" y2="92" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <line x1="324" y1="76" x2="329" y2="82" stroke="#c9a84c" stroke-width="2" opacity="0.5"/>
  <line x1="351" y1="102" x2="356" y2="108" stroke="#c9a84c" stroke-width="2" opacity="0.5"/>
  <line x1="356" y1="76" x2="351" y2="82" stroke="#c9a84c" stroke-width="2" opacity="0.5"/>
  <text x="340" y="148" text-anchor="middle" fill="#e8c96a" font-size="9" font-family="sans-serif">Screen</text>

  <!-- Small filmmaker character bottom-left pointing at Box 1 -->
  <!-- Head -->
  <circle cx="50" cy="172" r="10" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M40,170 Q40,162 50,162 Q60,162 60,170 Q57,164 50,164 Q43,164 40,170Z" fill="#3d5166"/>
  <!-- Body -->
  <rect x="42" y="182" width="16" height="18" rx="8" fill="#c0533a"/>
  <!-- Pointing arm -->
  <path d="M58,186 Q72,182 80,90" stroke="#d4956a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="90" r="4" fill="#d4956a"/>

  <!-- Gold stars -->
  <text x="280" y="180" fill="#c9a84c" opacity="0.4" font-size="26">★</text>
  <text x="10" y="185" fill="#c9a84c" opacity="0.45" font-size="20">★</text>
</svg>
