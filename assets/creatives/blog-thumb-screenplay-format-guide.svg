<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#162032"/>
  <!-- Depth circles -->
  <circle cx="190" cy="100" r="130" fill="#1e2f45" opacity="0.45"/>
  <circle cx="310" cy="160" r="80" fill="#0d1b2a" opacity="0.5"/>
  <!-- Spotlight from top -->
  <polygon points="190,0 130,200 250,200" fill="#c9a84c" opacity="0.06"/>
  <!-- Screenplay page mockup -->
  <rect x="90" y="24" width="130" height="162" rx="4" fill="#f5f0e8"/>
  <!-- Page top stripe (header) -->
  <rect x="90" y="24" width="130" height="12" rx="4" fill="#e8e0d0"/>
  <!-- Ruler along top -->
  <rect x="90" y="22" width="130" height="5" rx="2" fill="#c9a84c" opacity="0.85"/>
  <!-- Ruler tick marks -->
  <line x1="110" y1="22" x2="110" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <line x1="130" y1="22" x2="130" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <line x1="150" y1="22" x2="150" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <line x1="170" y1="22" x2="170" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <line x1="190" y1="22" x2="190" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <line x1="210" y1="22" x2="210" y2="27" stroke="#0d1b2a" stroke-width="1"/>
  <!-- Left margin indicator (rust) -->
  <rect x="88" y="36" width="3" height="144" rx="1" fill="#c0533a" opacity="0.8"/>
  <!-- Right margin indicator (rust) -->
  <rect x="219" y="36" width="3" height="144" rx="1" fill="#c0533a" opacity="0.8"/>
  <!-- Scene heading: INT. COFFEE SHOP - DAY -->
  <rect x="96" y="40" width="115" height="7" rx="1" fill="#c9a84c" opacity="0.9"/>
  <text x="98" y="47" font-family="monospace" font-size="5" fill="#0d1b2a" font-weight="bold">INT. COFFEE SHOP — DAY</text>
  <!-- Action lines -->
  <rect x="96" y="54" width="100" height="4" rx="1" fill="#3d5166" opacity="0.7"/>
  <rect x="96" y="61" width="85" height="4" rx="1" fill="#3d5166" opacity="0.7"/>
  <rect x="96" y="68" width="95" height="4" rx="1" fill="#3d5166" opacity="0.7"/>
  <!-- Tick mark + label: ACTION -->
  <circle cx="238" cy="62" r="5" fill="#2a7f7f" opacity="0.8"/>
  <text x="245" y="65" font-family="monospace" font-size="5" fill="#2a7f7f">ACTION</text>
  <!-- Character name: centered gold -->
  <rect x="130" y="78" width="55" height="6" rx="1" fill="#c9a84c" opacity="0.8"/>
  <text x="132" y="83" font-family="monospace" font-size="5" fill="#0d1b2a" font-weight="bold">     DIANA</text>
  <!-- Tick mark + label: CHARACTER -->
  <circle cx="238" cy="81" r="5" fill="#2a7f7f" opacity="0.8"/>
  <text x="245" y="84" font-family="monospace" font-size="5" fill="#2a7f7f">CHARACTER</text>
  <!-- Parenthetical -->
  <rect x="118" y="88" width="55" height="5" rx="1" fill="#2c3e50" opacity="0.6"/>
  <text x="120" y="92" font-family="monospace" font-size="4" fill="#3d5166">(quietly)</text>
  <!-- Dialogue lines -->
  <rect x="108" y="97" width="95" height="4" rx="1" fill="#2c3e50" opacity="0.5"/>
  <rect x="108" y="104" width="78" height="4" rx="1" fill="#2c3e50" opacity="0.5"/>
  <!-- Tick mark + label: DIALOGUE -->
  <circle cx="238" cy="101" r="5" fill="#2a7f7f" opacity="0.8"/>
  <text x="245" y="104" font-family="monospace" font-size="5" fill="#2a7f7f">DIALOGUE</text>
  <!-- Second slugline -->
  <rect x="96" y="116" width="108" height="6" rx="1" fill="#c9a84c" opacity="0.7"/>
  <text x="98" y="121" font-family="monospace" font-size="5" fill="#0d1b2a">EXT. ROOFTOP — NIGHT</text>
  <!-- More action lines -->
  <rect x="96" y="128" width="95" height="4" rx="1" fill="#3d5166" opacity="0.5"/>
  <rect x="96" y="135" width="72" height="4" rx="1" fill="#3d5166" opacity="0.5"/>
  <rect x="96" y="142" width="88" height="4" rx="1" fill="#3d5166" opacity="0.5"/>
  <rect x="96" y="149" width="60" height="4" rx="1" fill="#3d5166" opacity="0.4"/>
  <rect x="96" y="157" width="80" height="4" rx="1" fill="#3d5166" opacity="0.35"/>
  <!-- Gold stars -->
  <text x="48" y="55" font-family="serif" font-size="18" fill="#c9a84c" opacity="0.4">★</text>
  <text x="330" y="48" font-family="serif" font-size="14" fill="#c9a84c" opacity="0.45">★</text>
  <!-- Radial glow -->
  <circle cx="155" cy="100" r="90" fill="#c9a84c" opacity="0.04"/>
</svg>
