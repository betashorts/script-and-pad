<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#0d1b2a"/>
  <!-- Depth circles -->
  <circle cx="190" cy="100" r="140" fill="#162032" opacity="0.5"/>
  <circle cx="50" cy="160" r="70" fill="#0d1b2a" opacity="0.6"/>
  <!-- Spotlight from top -->
  <polygon points="190,0 110,200 270,200" fill="#c9a84c" opacity="0.06"/>

  <!-- LEFT HALF: Script page -->
  <rect x="28" y="30" width="140" height="140" rx="5" fill="#1e2f45"/>
  <rect x="28" y="30" width="140" height="140" rx="5" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <!-- Script page inner -->
  <rect x="36" y="40" width="124" height="120" rx="3" fill="#f5f0e8"/>
  <!-- Scene heading line -->
  <rect x="42" y="48" width="110" height="6" rx="1" fill="#c9a84c" opacity="0.85"/>
  <text x="44" y="53" font-family="monospace" font-size="4.5" fill="#0d1b2a" font-weight="bold">INT. RECORDING STUDIO - NIGHT</text>
  <!-- Action lines -->
  <rect x="42" y="60" width="98" height="3.5" rx="1" fill="#3d5166" opacity="0.6"/>
  <rect x="42" y="66" width="82" height="3.5" rx="1" fill="#3d5166" opacity="0.6"/>
  <!-- Musical note embedded in page -->
  <text x="128" y="80" font-family="serif" font-size="16" fill="#c9a84c" opacity="0.7">♪</text>
  <!-- More lines -->
  <rect x="42" y="80" width="75" height="3.5" rx="1" fill="#3d5166" opacity="0.5"/>
  <rect x="42" y="88" width="90" height="3.5" rx="1" fill="#3d5166" opacity="0.5"/>
  <!-- Lyric cue line (gold) -->
  <rect x="42" y="98" width="105" height="4" rx="1" fill="#c9a84c" opacity="0.45"/>
  <text x="44" y="102" font-family="monospace" font-size="3.5" fill="#0d1b2a">At 0:47 — CHORUS — Push in on her face</text>
  <!-- More action lines -->
  <rect x="42" y="108" width="88" height="3.5" rx="1" fill="#3d5166" opacity="0.4"/>
  <rect x="42" y="115" width="70" height="3.5" rx="1" fill="#3d5166" opacity="0.35"/>
  <rect x="42" y="122" width="96" height="3.5" rx="1" fill="#3d5166" opacity="0.3"/>
  <rect x="42" y="130" width="65" height="3.5" rx="1" fill="#3d5166" opacity="0.25"/>
  <rect x="42" y="138" width="85" height="3.5" rx="1" fill="#3d5166" opacity="0.2"/>

  <!-- Gold diagonal connector line between halves -->
  <line x1="168" y1="70" x2="215" y2="100" stroke="#c9a84c" stroke-width="2" opacity="0.6"/>
  <circle cx="168" cy="70" r="3" fill="#c9a84c" opacity="0.7"/>
  <circle cx="215" cy="100" r="3" fill="#c9a84c" opacity="0.7"/>

  <!-- RIGHT HALF: Waveform bars -->
  <rect x="212" y="38" width="138" height="124" rx="5" fill="#162032"/>
  <!-- Waveform audio bars (gold + teal) -->
  <rect x="222" y="90" width="7" height="40" rx="3" fill="#2a7f7f" opacity="0.8"/>
  <rect x="233" y="72" width="7" height="56" rx="3" fill="#c9a84c" opacity="0.9"/>
  <rect x="244" y="82" width="7" height="46" rx="3" fill="#2a7f7f" opacity="0.7"/>
  <rect x="255" y="60" width="7" height="68" rx="3" fill="#c9a84c" opacity="0.95"/>
  <rect x="266" y="78" width="7" height="52" rx="3" fill="#2a7f7f" opacity="0.8"/>
  <rect x="277" y="50" width="7" height="78" rx="3" fill="#c9a84c" opacity="0.9"/>
  <rect x="288" y="68" width="7" height="62" rx="3" fill="#2a7f7f" opacity="0.75"/>
  <rect x="299" y="82" width="7" height="48" rx="3" fill="#c9a84c" opacity="0.85"/>
  <rect x="310" y="74" width="7" height="56" rx="3" fill="#2a7f7f" opacity="0.7"/>
  <rect x="321" y="88" width="7" height="44" rx="3" fill="#c9a84c" opacity="0.8"/>
  <rect x="332" y="76" width="7" height="52" rx="3" fill="#2a7f7f" opacity="0.65"/>
  <!-- Waveform center line -->
  <line x1="218" y1="130" x2="344" y2="130" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <!-- Flat filmmaker/musician character, center-ish -->
  <!-- Head -->
  <circle cx="192" cy="118" r="11" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M181 115 Q192 104 203 115 L203 110 Q192 99 181 110 Z" fill="#253652"/>
  <!-- Body (teal) -->
  <rect x="180" y="130" width="24" height="28" rx="12" fill="#2a7f7f"/>
  <!-- Left arm holds script -->
  <path d="M180 138 Q168 140 162 148" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Script in left hand -->
  <rect x="150" y="145" width="14" height="18" rx="2" fill="#f5f0e8" opacity="0.9"/>
  <rect x="153" y="149" width="8" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
  <rect x="153" y="153" width="8" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
  <!-- Right arm holds mic -->
  <path d="M204 138 Q216 140 220 148" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Mic in right hand -->
  <rect x="218" y="145" width="7" height="12" rx="3" fill="#c9a84c" opacity="0.85"/>
  <line x1="221" y1="157" x2="221" y2="163" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>
  <!-- Legs -->
  <rect x="182" y="158" width="8" height="16" rx="4" fill="#1e2f45"/>
  <rect x="194" y="158" width="8" height="16" rx="4" fill="#1e2f45"/>

  <!-- Small clapperboard top-right -->
  <rect x="340" y="14" width="28" height="22" rx="3" fill="#1e2f45" stroke="#c9a84c" stroke-width="1"/>
  <rect x="340" y="14" width="28" height="8" rx="2" fill="#c9a84c" opacity="0.8"/>
  <line x1="344" y1="14" x2="341" y2="22" stroke="#0d1b2a" stroke-width="2"/>
  <line x1="351" y1="14" x2="348" y2="22" stroke="#0d1b2a" stroke-width="2"/>
  <line x1="358" y1="14" x2="355" y2="22" stroke="#0d1b2a" stroke-width="2"/>
  <line x1="365" y1="14" x2="362" y2="22" stroke="#0d1b2a" stroke-width="2"/>

  <!-- Vinyl record bottom-right -->
  <circle cx="354" cy="170" r="18" fill="#1e2f45" stroke="#c9a84c" stroke-width="1" opacity="0.8"/>
  <circle cx="354" cy="170" r="10" fill="#0d1b2a"/>
  <circle cx="354" cy="170" r="4" fill="#c9a84c" opacity="0.5"/>

  <!-- Gold stars -->
  <text x="20" y="26" font-family="serif" font-size="16" fill="#c9a84c" opacity="0.4">★</text>
  <text x="355" y="65" font-family="serif" font-size="13" fill="#c9a84c" opacity="0.45">★</text>
  <!-- Radial glow -->
  <circle cx="190" cy="100" r="100" fill="#c9a84c" opacity="0.04"/>
</svg>
