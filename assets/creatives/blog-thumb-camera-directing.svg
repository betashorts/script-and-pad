<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multiple camera viewfinder frames with filmmaker and directional arrows illustration">
  <rect width="380" height="200" fill="#0d1b2a"/>
  <!-- Depth circles -->
  <circle cx="190" cy="95" r="130" fill="#162032" fill-opacity="0.55"/>
  <circle cx="340" cy="40" r="75" fill="#1e2f45" fill-opacity="0.45"/>
  <!-- Radial glow -->
  <circle cx="200" cy="90" r="95" fill="#c9a84c" fill-opacity="0.05"/>

  <!-- Viewfinder frame 1 (back, large, rotated left) -->
  <g transform="rotate(-8 155 95)">
    <rect x="90" y="38" width="130" height="94" rx="5" fill="none" stroke="#253652" stroke-width="2.5"/>
    <!-- Corner brackets -->
    <path d="M90 38 L90 56 M90 38 L108 38" stroke="#3d5166" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M220 38 L220 56 M220 38 L202 38" stroke="#3d5166" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M90 132 L90 114 M90 132 L108 132" stroke="#3d5166" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M220 132 L220 114 M220 132 L202 132" stroke="#3d5166" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Viewfinder frame 2 (mid, rotated right) -->
  <g transform="rotate(10 205 90)">
    <rect x="140" y="32" width="130" height="94" rx="5" fill="none" stroke="#2a7f7f" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M140 32 L140 50 M140 32 L158 32" stroke="#2a7f7f" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
    <path d="M270 32 L270 50 M270 32 L252 32" stroke="#2a7f7f" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
    <path d="M140 126 L140 108 M140 126 L158 126" stroke="#2a7f7f" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
    <path d="M270 126 L270 108 M270 126 L252 126" stroke="#2a7f7f" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
  </g>

  <!-- MAIN Viewfinder frame (front, gold, centered) -->
  <rect x="116" y="28" width="148" height="106" rx="6" fill="#0d1b2a" fill-opacity="0.4" stroke="#c9a84c" stroke-width="2.5"/>
  <!-- Gold corner brackets -->
  <path d="M116 28 L116 48 M116 28 L136 28" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M264 28 L264 48 M264 28 L244 28" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M116 134 L116 114 M116 134 L136 134" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M264 134 L264 114 M264 134 L244 134" stroke="#c9a84c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Crosshair -->
  <line x1="190" y1="50" x2="190" y2="112" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <line x1="132" y1="81" x2="248" y2="81" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <circle cx="190" cy="81" r="6" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- REC dot -->
  <circle cx="248" cy="40" r="4" fill="#c0533a"/>
  <text x="254" y="44" fill="#c0533a" font-size="6" font-family="monospace">REC</text>
  <!-- Frame counter -->
  <text x="128" y="44" fill="#c9a84c" font-size="6" font-family="monospace" opacity="0.6">24fps</text>

  <!-- Pan arrow (horizontal, below frame) -->
  <path d="M135 150 L245 150" stroke="#c9a84c" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arr)" marker-start="url(#arr-l)"/>
  <text x="175" y="165" fill="#c9a84c" font-size="6" font-family="monospace" opacity="0.6">PAN →</text>

  <!-- Tilt arrow (vertical, right of frame) -->
  <path d="M278 50 L278 130" stroke="#c9a84c" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="278,44 274,54 282,54" fill="#c9a84c" fill-opacity="0.7"/>
  <polygon points="278,136 274,126 282,126" fill="#c9a84c" fill-opacity="0.7"/>
  <text x="284" y="95" fill="#c9a84c" font-size="6" font-family="monospace" opacity="0.6" writing-mode="vertical-rl" transform="rotate(90 286 88)">TILT</text>

  <!-- Filmmaker character (bottom left, looking through small camera) -->
  <!-- Small handheld camera -->
  <rect x="38" y="130" width="38" height="24" rx="4" fill="#1e2f45"/>
  <circle cx="50" cy="142" r="8" fill="#0d1b2a"/>
  <circle cx="50" cy="142" r="5.5" fill="#162032"/>
  <circle cx="50" cy="142" r="3" fill="#2a7f7f"/>
  <circle cx="50" cy="142" r="1" fill="#0d1b2a"/>
  <rect x="66" y="130" width="8" height="8" rx="1" fill="#3d5166"/>
  <circle cx="72" cy="148" r="3.5" fill="#c0533a" opacity="0.8"/>
  <!-- Character body -->
  <rect x="24" y="160" width="40" height="36" rx="10" fill="#2c3e50"/>
  <!-- Head (looking through camera eyepiece) -->
  <circle cx="44" cy="148" r="14" fill="#d4956a"/>
  <!-- One eye squinting at viewfinder -->
  <line x1="36" y1="147" x2="42" y2="147" stroke="#2c3e50" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="147" r="2" fill="#2c3e50"/>
  <!-- Hair -->
  <path d="M30 142 Q33 130 44 128 Q55 130 58 142 Q53 133 44 131 Q35 133 30 142Z" fill="#3d2b1f"/>
  <!-- Arms holding camera -->
  <path d="M28 168 Q22 158 22 148" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 168 Q70 158 76 148" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="34" y1="196" x2="32" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>
  <line x1="54" y1="196" x2="56" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>

  <!-- Gold stars -->
  <text x="16" y="36" fill="#c9a84c" font-size="14" opacity="0.45">★</text>
  <text x="348" y="182" fill="#c9a84c" font-size="12" opacity="0.42">★</text>
  <!-- Dots -->
  <circle cx="356" cy="30" r="3" fill="#c9a84c" opacity="0.4"/>
  <circle cx="18" cy="180" r="3" fill="#2a7f7f" opacity="0.5"/>
  <circle cx="346" cy="158" r="3" fill="#c0533a" opacity="0.35"/>
</svg>
