<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stopwatch with film strip hand and timeline bar illustration">
  <rect width="380" height="200" fill="#0d1b2a"/>
  <!-- Depth circles -->
  <circle cx="155" cy="95" r="120" fill="#162032" fill-opacity="0.6"/>
  <circle cx="320" cy="50" r="75" fill="#1e2f45" fill-opacity="0.45"/>
  <!-- Radial glow behind clock -->
  <circle cx="150" cy="95" r="85" fill="#c9a84c" fill-opacity="0.06"/>

  <!-- Stopwatch body -->
  <!-- Outer ring -->
  <circle cx="150" cy="104" r="74" fill="#162032" stroke="#2c3e50" stroke-width="3"/>
  <circle cx="150" cy="104" r="74" fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Inner face -->
  <circle cx="150" cy="104" r="64" fill="#1e2f45"/>
  <!-- Crown / button top -->
  <rect x="139" y="22" width="22" height="12" rx="4" fill="#3d5166"/>
  <rect x="143" y="16" width="14" height="8" rx="3" fill="#2c3e50"/>
  <!-- Side button -->
  <rect x="216" y="56" width="12" height="8" rx="3" fill="#3d5166"/>

  <!-- Clock tick marks -->
  <g stroke="#3d5166" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="150" y1="44" x2="150" y2="52"/>
    <line x1="150" y1="156" x2="150" y2="164"/>
    <line x1="88" y1="104" x2="96" y2="104"/>
    <line x1="204" y1="104" x2="212" y2="104"/>
    <line x1="105" y1="59" x2="110" y2="66"/>
    <line x1="195" y1="59" x2="190" y2="66"/>
    <line x1="105" y1="149" x2="110" y2="142"/>
    <line x1="195" y1="149" x2="190" y2="142"/>
  </g>
  <!-- Larger ticks at 12, 3, 6, 9 -->
  <g stroke="#c9a84c" stroke-width="2.5" stroke-opacity="0.5">
    <line x1="150" y1="43" x2="150" y2="55"/>
    <line x1="150" y1="153" x2="150" y2="165"/>
    <line x1="87" y1="104" x2="99" y2="104"/>
    <line x1="201" y1="104" x2="213" y2="104"/>
  </g>

  <!-- Film strip as clock hand (pointing to ~10 o'clock — the sweet spot direction) -->
  <g transform="rotate(-60 150 104)">
    <!-- Film strip hand -->
    <rect x="148" y="64" width="14" height="42" rx="2" fill="#c9a84c"/>
    <!-- Perforations on film strip -->
    <rect x="149" y="67" width="4" height="4" rx="1" fill="#1e2f45"/>
    <rect x="157" y="67" width="4" height="4" rx="1" fill="#1e2f45"/>
    <rect x="149" y="77" width="4" height="4" rx="1" fill="#1e2f45"/>
    <rect x="157" y="77" width="4" height="4" rx="1" fill="#1e2f45"/>
    <rect x="149" y="87" width="4" height="4" rx="1" fill="#1e2f45"/>
    <rect x="157" y="87" width="4" height="4" rx="1" fill="#1e2f45"/>
    <!-- Arrow tip -->
    <polygon points="148,64 162,64 155,56" fill="#e8c96a"/>
  </g>
  <!-- Center pin -->
  <circle cx="150" cy="104" r="6" fill="#c9a84c"/>
  <circle cx="150" cy="104" r="3" fill="#162032"/>

  <!-- Minutes label inside clock face -->
  <text x="150" y="135" fill="#c9a84c" font-size="8" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" opacity="0.75">5–12 min</text>
  <text x="150" y="145" fill="#3d5166" font-size="6" font-family="monospace" text-anchor="middle" opacity="0.6">sweet spot</text>

  <!-- Timeline bar (bottom right area) -->
  <!-- Track -->
  <rect x="248" y="130" width="112" height="12" rx="6" fill="#1e2f45" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Full bar fill (gray) -->
  <rect x="248" y="130" width="112" height="12" rx="6" fill="#253652" fill-opacity="0.5"/>
  <!-- "Sweet spot" gold highlight zone (5–12 min area) -->
  <rect x="284" y="130" width="44" height="12" rx="2" fill="#c9a84c" fill-opacity="0.8"/>
  <!-- Min markers -->
  <text x="250" y="124" fill="#3d5166" font-size="5.5" font-family="monospace" opacity="0.7">0</text>
  <text x="278" y="124" fill="#3d5166" font-size="5.5" font-family="monospace" opacity="0.7">5</text>
  <text x="318" y="124" fill="#c9a84c" font-size="5.5" font-family="monospace" opacity="0.9">12</text>
  <text x="350" y="124" fill="#3d5166" font-size="5.5" font-family="monospace" opacity="0.7">40</text>
  <!-- "SWEET SPOT" label on bar -->
  <text x="306" y="139" fill="#0d1b2a" font-size="5" font-family="monospace" font-weight="bold" text-anchor="middle">SWEET SPOT</text>

  <!-- Thinking character (right side) -->
  <!-- Body -->
  <rect x="286" y="148" width="42" height="40" rx="10" fill="#2c3e50"/>
  <!-- Head -->
  <circle cx="307" cy="136" r="15" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M292 131 Q295 119 307 117 Q319 119 322 131 Q317 123 307 121 Q297 123 292 131Z" fill="#3d2b1f"/>
  <!-- Thinking expression — hand on chin -->
  <circle cx="301" cy="136" r="2" fill="#2c3e50"/>
  <circle cx="313" cy="136" r="2" fill="#2c3e50"/>
  <!-- Slight hmm look -->
  <path d="M301 143 Q307 146 313 143" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arm — hand on chin (thinking pose) -->
  <path d="M290 158 Q276 152 270 144" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="270" cy="144" r="7" fill="#d4956a"/>
  <!-- Thought bubble -->
  <circle cx="272" cy="126" r="3" fill="#1e2f45" fill-opacity="0.7"/>
  <circle cx="260" cy="116" r="4" fill="#1e2f45" fill-opacity="0.7"/>
  <circle cx="247" cy="106" r="6" fill="#1e2f45"/>
  <text x="244" y="110" fill="#c9a84c" font-size="6" font-family="monospace" opacity="0.75">?</text>
  <!-- Other arm -->
  <path d="M324 158 Q338 166 342 178" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="297" y1="188" x2="294" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>
  <line x1="317" y1="188" x2="320" y2="200" stroke="#d4956a" stroke-width="8" stroke-linecap="round"/>

  <!-- Script page background (small, top right) -->
  <rect x="338" y="42" width="30" height="40" rx="3" fill="#1e2f45" transform="rotate(8 353 62)"/>
  <rect x="343" y="49" width="16" height="1.5" rx="1" fill="#3d5166" opacity="0.5" transform="rotate(8 351 50)"/>
  <rect x="343" y="54" width="12" height="1.5" rx="1" fill="#3d5166" opacity="0.5" transform="rotate(8 349 55)"/>

  <!-- Gold stars -->
  <text x="16" y="36" fill="#c9a84c" font-size="14" opacity="0.45">★</text>
  <text x="224" y="192" fill="#c9a84c" font-size="12" opacity="0.42">★</text>
  <!-- Dots -->
  <circle cx="356" cy="180" r="3" fill="#c9a84c" opacity="0.4"/>
  <circle cx="20" cy="175" r="3" fill="#2a7f7f" opacity="0.5"/>
  <circle cx="230" cy="38" r="3" fill="#c0533a" opacity="0.35"/>
</svg>
