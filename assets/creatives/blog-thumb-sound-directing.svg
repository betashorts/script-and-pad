  <circle cx="326" cy="165" r="5" fill="#c9a84c"/>
  <circle cx="342" cy="162" r="5" fill="#2a7f7f"/>

  <!-- Gold stars -->
  <text x="16" y="28" font-family="Arial,sans-serif" font-size="16" fill="#c9a84c" opacity="0.45">★</text>
  <text x="348" y="192" font-family="Arial,sans-serif" font-size="14" fill="#c9a84c" opacity="0.4">★</text>
