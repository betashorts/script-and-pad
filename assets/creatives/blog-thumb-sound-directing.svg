  <path d="M326 138 Q336 148 340 152" stroke="#d4956a" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Mixing desk -->
  <rect x="248" y="152" width="108" height="30" rx="5" fill="#253652"/>
  <!-- Fader knobs -->
  <circle cx="262" cy="164" r="5" fill="#c9a84c"/>
  <circle cx="278" cy="160" r="5" fill="#2a7f7f"/>
  <circle cx="294" cy="167" r="5" fill="#c9a84c"/>
