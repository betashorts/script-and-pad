  <rect x="46" y="92" width="8" height="16" rx="2" fill="#0d1b2a"/>
  <!-- Film perforations right -->
  <rect x="322" y="92" width="8" height="16" rx="2" fill="#0d1b2a"/>
  <rect x="334" y="92" width="8" height="16" rx="2" fill="#0d1b2a"/>

