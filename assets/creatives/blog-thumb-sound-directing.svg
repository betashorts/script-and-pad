  <rect x="172" y="94" width="6" height="12" rx="2" fill="#c9a84c" opacity="0.7"/>
  <rect x="182" y="78" width="6" height="44" rx="2" fill="#c9a84c"/>
  <rect x="192" y="88" width="6" height="24" rx="2" fill="#e8c96a"/>
  <rect x="202" y="66" width="6" height="68" rx="2" fill="#c9a84c"/>
  <rect x="212" y="90" width="6" height="20" rx="2" fill="#2a7f7f"/>
