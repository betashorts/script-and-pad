  <rect x="232" y="94" width="6" height="12" rx="2" fill="#e8c96a" opacity="0.8"/>
  <rect x="242" y="80" width="6" height="40" rx="2" fill="#c9a84c"/>
  <rect x="252" y="88" width="6" height="24" rx="2" fill="#2a7f7f"/>
  <rect x="262" y="96" width="6" height="8" rx="2" fill="#c9a84c" opacity="0.6"/>
