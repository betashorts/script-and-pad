  <!-- Mic grille lines -->
  <line x1="36" y1="48" x2="68" y2="48" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
  <line x1="36" y1="55" x2="68" y2="55" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
