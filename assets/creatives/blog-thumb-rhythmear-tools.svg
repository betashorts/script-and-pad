<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#1e2f45"/>
  <circle cx="310" cy="160" r="130" fill="#253652" opacity="0.5"/>
  <circle cx="55" cy="40" r="80" fill="#0d1b2a" opacity="0.6"/>

  <!-- Large headphones (centred) -->
  <!-- Band arc -->
  <path d="M100 110 Q100 30 190 30 Q280 30 280 110" stroke="#253652" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M100 110 Q100 35 190 35 Q280 35 280 110" stroke="#1e2f45" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Left ear cup -->
  <ellipse cx="88" cy="116" rx="28" ry="34" fill="#0d1b2a" stroke="#253652" stroke-width="2.5"/>
  <ellipse cx="88" cy="116" rx="20" ry="26" fill="#162032"/>
  <!-- Speaker driver hint -->
  <circle cx="88" cy="116" r="12" fill="#253652" opacity="0.8"/>
  <circle cx="88" cy="116" r="6" fill="#0d1b2a"/>
  <circle cx="88" cy="116" r="2.5" fill="#c9a84c" opacity="0.6"/>

  <!-- Right ear cup -->
  <ellipse cx="292" cy="116" rx="28" ry="34" fill="#0d1b2a" stroke="#253652" stroke-width="2.5"/>
  <ellipse cx="292" cy="116" rx="20" ry="26" fill="#162032"/>
  <circle cx="292" cy="116" r="12" fill="#253652" opacity="0.8"/>
  <circle cx="292" cy="116" r="6" fill="#0d1b2a"/>
  <circle cx="292" cy="116" r="2.5" fill="#c9a84c" opacity="0.6"/>

  <!-- Cable from left cup -->
  <path d="M88 150 Q88 175 140 178 Q190 180 190 195" stroke="#253652" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Jack plug -->
  <rect x="186" y="193" width="8" height="14" rx="3" fill="#253652"/>
  <rect x="188" y="188" width="4" height="7" rx="2" fill="#1e2f45"/>

  <!-- Sound waves / rhythm pattern between cups -->
  <!-- Waveform display panel -->
  <rect x="118" y="72" width="144" height="60" rx="5" fill="#0d1b2a" stroke="#253652" stroke-width="1.5"/>
  <!-- Centre line -->
  <line x1="122" y1="102" x2="258" y2="102" stroke="#253652" stroke-width="0.8"/>
  <!-- Rhythm waveform (vertical bars) -->
  <rect x="126" y="90" width="6" height="24" rx="1" fill="#c9a84c" opacity="0.9"/>
  <rect x="135" y="96" width="6" height="12" rx="1" fill="#2a7f7f" opacity="0.7"/>
  <rect x="144" y="86" width="6" height="32" rx="1" fill="#c9a84c" opacity="0.9"/>
  <rect x="153" y="97" width="6" height="10" rx="1" fill="#2a7f7f" opacity="0.6"/>
  <rect x="162" y="91" width="6" height="22" rx="1" fill="#c9a84c" opacity="0.8"/>
  <rect x="171" y="96" width="6" height="12" rx="1" fill="#2a7f7f" opacity="0.7"/>
  <rect x="180" y="84" width="6" height="36" rx="1" fill="#c9a84c"/>
  <rect x="189" y="97" width="6" height="10" rx="1" fill="#2a7f7f" opacity="0.6"/>
  <rect x="198" y="90" width="6" height="24" rx="1" fill="#c9a84c" opacity="0.9"/>
  <rect x="207" y="95" width="6" height="14" rx="1" fill="#2a7f7f" opacity="0.7"/>
  <rect x="216" y="87" width="6" height="30" rx="1" fill="#c9a84c" opacity="0.85"/>
  <rect x="225" y="96" width="6" height="12" rx="1" fill="#2a7f7f" opacity="0.6"/>
  <rect x="234" y="92" width="6" height="20" rx="1" fill="#c9a84c" opacity="0.8"/>
  <rect x="243" y="97" width="6" height="10" rx="1" fill="#2a7f7f" opacity="0.7"/>
  <rect x="252" y="89" width="6" height="26" rx="1" fill="#c9a84c" opacity="0.75"/>

  <!-- Step grid (mini, at bottom of panel) -->
  <rect x="122" y="142" width="134" height="8" rx="2" fill="#162032"/>
  <!-- Active steps -->
  <rect x="124" y="143" width="9" height="6" rx="1" fill="#c9a84c"/>
  <rect x="148" y="143" width="9" height="6" rx="1" fill="#c0533a"/>
  <rect x="172" y="143" width="9" height="6" rx="1" fill="#c9a84c"/>
  <rect x="196" y="143" width="9" height="6" rx="1" fill="#e8c96a"/>
  <rect x="220" y="143" width="9" height="6" rx="1" fill="#c9a84c"/>
  <rect x="244" y="143" width="9" height="6" rx="1" fill="#c0533a"/>

  <!-- Score badge -->
  <rect x="150" y="157" width="80" height="20" rx="6" fill="#c9a84c"/>
  <text x="190" y="171" font-family="Arial,sans-serif" font-size="9" fill="#0d1b2a" text-anchor="middle" font-weight="bold">95% MATCH ★</text>

  <!-- Musical notes -->
  <text x="30" y="85" font-family="Arial,sans-serif" font-size="18" fill="#c9a84c" opacity="0.3">♩</text>
  <text x="340" y="78" font-family="Arial,sans-serif" font-size="16" fill="#c9a84c" opacity="0.3">♪</text>
  <text x="20" y="190" font-family="Arial,sans-serif" font-size="13" fill="#c9a84c" opacity="0.25">♫</text>
  <text x="345" y="185" font-family="Arial,sans-serif" font-size="12" fill="#c9a84c" opacity="0.25">♫</text>

  <!-- Gold star -->
  <text x="355" y="24" font-family="Arial,sans-serif" font-size="15" fill="#c9a84c" opacity="0.4">★</text>
</svg>
