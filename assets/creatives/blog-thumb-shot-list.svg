<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clipboard shot list with filmmaker and camera illustration">
  <rect width="380" height="200" fill="#0d1b2a"/>
  <!-- Depth circles -->
  <circle cx="175" cy="95" r="125" fill="#162032" fill-opacity="0.6"/>
  <circle cx="340" cy="55" r="65" fill="#1e2f45" fill-opacity="0.45"/>
  <!-- Radial glow -->
  <circle cx="175" cy="95" r="90" fill="#c9a84c" fill-opacity="0.05"/>

  <!-- Camera on tripod (background, right) -->
  <!-- Tripod legs -->
  <line x1="306" y1="112" x2="278" y2="190" stroke="#253652" stroke-width="4" stroke-linecap="round"/>
  <line x1="306" y1="112" x2="306" y2="190" stroke="#253652" stroke-width="4" stroke-linecap="round"/>
  <line x1="306" y1="112" x2="334" y2="190" stroke="#253652" stroke-width="4" stroke-linecap="round"/>
  <rect x="292" y="106" width="28" height="6" rx="2" fill="#253652"/>
  <!-- Camera body -->
  <rect x="284" y="80" width="44" height="28" rx="4" fill="#1e2f45"/>
  <rect x="290" y="70" width="16" height="12" rx="2" fill="#1e2f45"/>
  <!-- Lens -->
  <circle cx="306" cy="94" r="10" fill="#0d1b2a"/>
  <circle cx="306" cy="94" r="7.5" fill="#162032"/>
  <circle cx="306" cy="94" r="4.5" fill="#2a7f7f"/>
  <circle cx="306" cy="94" r="2" fill="#0d1b2a"/>
  <circle cx="302" cy="90" r="1.5" fill="#e8c96a" opacity="0.5"/>

  <!-- Clipboard (center) -->
  <!-- Board -->
  <rect x="90" y="32" width="118" height="148" rx="6" fill="#1e2f45"/>
  <!-- Clip at top -->
  <rect x="128" y="24" width="42" height="16" rx="4" fill="#3d5166"/>
  <rect x="136" y="28" width="26" height="8" rx="2" fill="#253652"/>
  <!-- Grid / shot list table -->
  <!-- Header row -->
  <rect x="98" y="48" width="102" height="14" rx="2" fill="#253652"/>
  <text x="103" y="58" fill="#c9a84c" font-size="5.5" font-family="monospace" font-weight="bold">SHOT  TYPE   ACTION</text>
  <!-- Divider lines (vertical) -->
  <line x1="118" y1="62" x2="118" y2="166" stroke="#3d5166" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="152" y1="62" x2="152" y2="166" stroke="#3d5166" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Row 1 -->
  <rect x="98" y="62" width="102" height="16" rx="0" fill="#162032" fill-opacity="0.5"/>
  <text x="102" y="73" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">01</text>
  <text x="122" y="73" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">WS</text>
  <text x="156" y="73" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.65">Establish</text>
  <!-- Gold checkmark row 1 -->
  <text x="190" y="73" fill="#c9a84c" font-size="8" opacity="0.85">✓</text>
  <!-- Row 2 -->
  <text x="102" y="89" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">02</text>
  <text x="122" y="89" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">MCU</text>
  <text x="156" y="89" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.65">Dialogue</text>
  <text x="190" y="89" fill="#c9a84c" font-size="8" opacity="0.85">✓</text>
  <!-- Row 3 -->
  <rect x="98" y="94" width="102" height="16" rx="0" fill="#162032" fill-opacity="0.5"/>
  <text x="102" y="105" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">03</text>
  <text x="122" y="105" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">OTS</text>
  <text x="156" y="105" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.65">Reaction</text>
  <text x="190" y="105" fill="#c9a84c" font-size="8" opacity="0.85">✓</text>
  <!-- Row 4 -->
  <text x="102" y="121" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">04</text>
  <text x="122" y="121" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.75">CU</text>
  <text x="156" y="121" fill="#f5f0e8" font-size="5" font-family="monospace" opacity="0.65">Insert</text>
  <!-- Row 5 (empty) -->
  <rect x="98" y="126" width="102" height="16" rx="0" fill="#162032" fill-opacity="0.5"/>
  <text x="102" y="137" fill="#3d5166" font-size="5" font-family="monospace" opacity="0.6">05</text>
  <text x="122" y="137" fill="#3d5166" font-size="5" font-family="monospace" opacity="0.6">—</text>
  <!-- Row 6 (empty) -->
  <text x="102" y="153" fill="#3d5166" font-size="5" font-family="monospace" opacity="0.5">06</text>
  <text x="122" y="153" fill="#3d5166" font-size="5" font-family="monospace" opacity="0.5">—</text>

  <!-- Filmmaker character pointing at clipboard -->
  <!-- Body -->
  <rect x="28" y="118" width="46" height="50" rx="12" fill="#c0533a"/>
  <!-- Head -->
  <circle cx="51" cy="106" r="17" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M34 100 Q37 86 51 84 Q65 86 68 100 Q62 91 51 89 Q40 91 34 100Z" fill="#5d3a1a"/>
  <!-- Eyes -->
  <circle cx="45" cy="105" r="2.2" fill="#2c3e50"/>
  <circle cx="57" cy="105" r="2.2" fill="#2c3e50"/>
  <!-- Smile -->
  <path d="M45 112 Q51 118 57 112" stroke="#2c3e50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Pointing arm (toward clipboard) -->
  <path d="M70 130 Q84 122 96 116" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="96" cy="116" r="7" fill="#d4956a"/>
  <!-- Other arm -->
  <path d="M32 130 Q18 142 16 158" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M42 168 L39 198" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 168 L63 198" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Gold stars -->
  <text x="16" y="36" fill="#c9a84c" font-size="14" opacity="0.45">★</text>
  <text x="350" y="170" fill="#c9a84c" font-size="12" opacity="0.42">★</text>
  <!-- Accent dots -->
  <circle cx="360" cy="30" r="3" fill="#c9a84c" opacity="0.4"/>
  <circle cx="22" cy="185" r="3" fill="#2a7f7f" opacity="0.5"/>
  <circle cx="356" cy="190" r="4" fill="#c0533a" opacity="0.3"/>
</svg>
