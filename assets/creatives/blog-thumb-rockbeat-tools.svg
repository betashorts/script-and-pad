<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#1e2f45"/>
  <!-- Depth -->
  <circle cx="290" cy="150" r="130" fill="#253652" opacity="0.5"/>
  <circle cx="60" cy="50" r="70" fill="#0d1b2a" opacity="0.55"/>

  <!-- Flat drum kit (centre) -->
  <!-- Bass drum (large circle, centre-bottom) -->
  <ellipse cx="185" cy="128" rx="52" ry="36" fill="#0d1b2a" stroke="#253652" stroke-width="2.5"/>
  <ellipse cx="185" cy="128" rx="42" ry="28" fill="#162032" stroke="#253652" stroke-width="1.5"/>
  <!-- Bass drum lug bolts -->
  <circle cx="155" cy="118" r="3" fill="#253652"/>
  <circle cx="215" cy="118" r="3" fill="#253652"/>
  <circle cx="155" cy="138" r="3" fill="#253652"/>
  <circle cx="215" cy="138" r="3" fill="#253652"/>
  <!-- Bass drum logo area -->
  <ellipse cx="185" cy="128" rx="18" ry="12" fill="#253652" opacity="0.6"/>
  <!-- Bass drum legs -->
  <line x1="145" y1="158" x2="130" y2="178" stroke="#253652" stroke-width="3" stroke-linecap="round"/>
  <line x1="225" y1="158" x2="240" y2="178" stroke="#253652" stroke-width="3" stroke-linecap="round"/>

  <!-- Snare drum (left) -->
  <ellipse cx="100" cy="115" rx="36" ry="14" fill="#0d1b2a" stroke="#253652" stroke-width="2"/>
  <rect x="66" y="115" width="68" height="14" fill="#162032"/>
  <ellipse cx="100" cy="129" rx="36" ry="14" fill="#1e2f45" stroke="#253652" stroke-width="1.5"/>
  <!-- Snare wires hint -->
  <line x1="72" y1="131" x2="128" y2="131" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <line x1="72" y1="134" x2="128" y2="134" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
  <!-- Stand -->
  <line x1="100" y1="143" x2="88" y2="170" stroke="#253652" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="143" x2="112" y2="170" stroke="#253652" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floor tom (right) -->
  <ellipse cx="272" cy="120" rx="30" ry="12" fill="#0d1b2a" stroke="#253652" stroke-width="2"/>
  <rect x="242" y="120" width="60" height="22" fill="#162032"/>
  <ellipse cx="272" cy="142" rx="30" ry="12" fill="#1e2f45" stroke="#253652" stroke-width="1.5"/>
  <!-- Tom legs -->
  <line x1="252" y1="154" x2="246" y2="175" stroke="#253652" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="292" y1="154" x2="298" y2="175" stroke="#253652" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hi-hat (far left) -->
  <!-- Stand -->
  <line x1="50" y1="75" x2="50" y2="175" stroke="#253652" stroke-width="2.5"/>
  <!-- Cymbals -->
  <ellipse cx="50" cy="68" rx="28" ry="7" fill="#c9a84c" opacity="0.85"/>
  <ellipse cx="50" cy="74" rx="28" ry="7" fill="#e8c96a" opacity="0.5"/>

  <!-- Crash cymbal (right) -->
  <line x1="335" y1="55" x2="320" y2="175" stroke="#253652" stroke-width="2"/>
  <ellipse cx="340" cy="50" rx="32" ry="7" fill="#c9a84c" opacity="0.6" transform="rotate(-15 340 50)"/>

  <!-- Drumsticks (crossed) -->
  <line x1="130" y1="75" x2="100" y2="108" stroke="#d4956a" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="75" x2="105" y2="108" stroke="#d4956a" stroke-width="4" stroke-linecap="round"/>

  <!-- 16-step grid at bottom showing basic rock pattern -->
  <rect x="18" y="152" width="344" height="38" rx="4" fill="#0d1b2a" stroke="#253652" stroke-width="1"/>
  <!-- Row labels -->
  <text x="20" y="164" font-family="Arial,sans-serif" font-size="5.5" fill="#2a7f7f">HH</text>
  <text x="20" y="176" font-family="Arial,sans-serif" font-size="5.5" fill="#2a7f7f">SN</text>
  <text x="20" y="187" font-family="Arial,sans-serif" font-size="5.5" fill="#2a7f7f">KK</text>

  <!-- HH steps (all 16 active) -->
  <rect x="32" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="52" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="72" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="92" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="112" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="132" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="152" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="172" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="192" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="212" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="232" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="252" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="272" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="292" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="312" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>
  <rect x="332" y="157" width="18" height="8" rx="1" fill="#c9a84c"/>

  <!-- SN steps (beats 5 and 13 = steps 5 and 13 in 16-step = snare on 2 and 4) -->
  <rect x="32" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="52" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="72" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="92" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="112" y="169" width="18" height="8" rx="1" fill="#e8c96a"/>
  <rect x="132" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="152" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="172" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="192" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="212" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="232" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="252" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="272" y="169" width="18" height="8" rx="1" fill="#e8c96a"/>
  <rect x="292" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="312" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="332" y="169" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>

  <!-- KK steps (beats 1 and 9 = kick on 1 and 3) -->
  <rect x="32" y="181" width="18" height="8" rx="1" fill="#c0533a"/>
  <rect x="52" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="72" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="92" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="112" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="132" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="152" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="172" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="192" y="181" width="18" height="8" rx="1" fill="#c0533a"/>
  <rect x="212" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="232" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="252" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="272" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="292" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="312" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>
  <rect x="332" y="181" width="18" height="8" rx="1" fill="#162032" stroke="#253652" stroke-width="0.5"/>

  <!-- Gold star -->
  <text x="355" y="24" font-family="Arial,sans-serif" font-size="15" fill="#c9a84c" opacity="0.4">★</text>
</svg>
