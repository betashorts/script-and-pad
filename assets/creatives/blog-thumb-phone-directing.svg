<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#162032"/>
  <!-- Depth circles -->
  <circle cx="310" cy="160" r="120" fill="#1e2f45" opacity="0.6"/>
  <circle cx="60" cy="40" r="90" fill="#0d1b2a" opacity="0.7"/>
  <!-- Spotlight glow -->
  <ellipse cx="190" cy="80" rx="100" ry="60" fill="#c9a84c" opacity="0.05"/>

  <!-- Makeshift tripod (stack of books) -->
  <rect x="30" y="120" width="44" height="10" rx="2" fill="#253652"/>
  <rect x="34" y="110" width="40" height="10" rx="2" fill="#2c3e50"/>
  <rect x="38" y="100" width="36" height="10" rx="2" fill="#253652"/>
  <rect x="42" y="92" width="30" height="8" rx="2" fill="#2c3e50"/>
  <!-- Tripod top connector -->
  <rect x="54" y="82" width="6" height="12" rx="2" fill="#c9a84c" opacity="0.7"/>

  <!-- Character body -->
  <rect x="115" y="90" width="34" height="45" rx="14" fill="#2a7f7f"/>
  <!-- Character legs -->
  <rect x="120" y="130" width="10" height="22" rx="6" fill="#1e2f45"/>
  <rect x="134" y="130" width="10" height="22" rx="6" fill="#1e2f45"/>
  <!-- Character head -->
  <circle cx="132" cy="82" r="16" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M116 76 Q132 60 148 76 L148 68 Q132 52 116 68 Z" fill="#253652"/>
  <!-- Eye -->
  <circle cx="137" cy="82" r="2.5" fill="#0d1b2a"/>
  <!-- Arms holding phone -->
  <path d="M115 100 Q95 108 80 118" stroke="#d4956a" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M149 100 Q164 108 172 120" stroke="#d4956a" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- Smartphone (horizontal - the correct way) -->
  <rect x="158" y="108" width="70" height="42" rx="5" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="163" y="113" width="60" height="32" rx="3" fill="#1e2f45"/>
  <!-- Camera app UI on screen -->
  <circle cx="193" cy="129" r="10" fill="#253652"/>
  <circle cx="193" cy="129" r="6" fill="#2c3e50"/>
  <circle cx="193" cy="129" r="3" fill="#0d1b2a"/>
  <!-- Record button -->
  <circle cx="215" cy="129" r="5" fill="#c0533a"/>
  <!-- Grid lines on screen -->
  <line x1="183" y1="113" x2="183" y2="145" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="203" y1="113" x2="203" y2="145" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="163" y1="124" x2="223" y2="124" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <line x1="163" y1="135" x2="223" y2="135" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>

  <!-- YES badge (horizontal) -->
  <rect x="160" y="94" width="30" height="12" rx="3" fill="#2a7f7f"/>
  <text x="175" y="104" font-family="Arial,sans-serif" font-size="8" fill="#f5f0e8" text-anchor="middle" font-weight="bold">YES</text>

  <!-- Vertical phone (wrong way) with NO cross -->
  <rect x="280" y="95" width="34" height="58" rx="5" fill="#0d1b2a" opacity="0.7" stroke="#c0533a" stroke-width="2"/>
  <rect x="285" y="101" width="24" height="46" rx="3" fill="#1e2f45" opacity="0.6"/>
  <!-- NO cross -->
  <line x1="274" y1="89" x2="320" y2="161" stroke="#c0533a" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="89" x2="274" y2="161" stroke="#c0533a" stroke-width="4" stroke-linecap="round"/>
  <!-- NO badge -->
  <rect x="282" y="82" width="28" height="12" rx="3" fill="#c0533a"/>
  <text x="296" y="92" font-family="Arial,sans-serif" font-size="8" fill="#f5f0e8" text-anchor="middle" font-weight="bold">NO</text>

  <!-- Motion lines from phone -->
  <line x1="232" y1="122" x2="246" y2="118" stroke="#c9a84c" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,2"/>
  <line x1="232" y1="129" x2="248" y2="129" stroke="#c9a84c" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,2"/>
  <line x1="232" y1="136" x2="246" y2="140" stroke="#c9a84c" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,2"/>

  <!-- Film strip prop (clapperboard) top right -->
  <rect x="320" y="18" width="40" height="32" rx="3" fill="#f5f0e8"/>
  <rect x="320" y="18" width="40" height="10" rx="2" fill="#0d1b2a"/>
  <line x1="325" y1="18" x2="321" y2="28" stroke="#c9a84c" stroke-width="2"/>
  <line x1="331" y1="18" x2="327" y2="28" stroke="#c9a84c" stroke-width="2"/>
  <line x1="337" y1="18" x2="333" y2="28" stroke="#c9a84c" stroke-width="2"/>
  <line x1="343" y1="18" x2="339" y2="28" stroke="#c9a84c" stroke-width="2"/>
  <line x1="349" y1="18" x2="345" y2="28" stroke="#c9a84c" stroke-width="2"/>
  <rect x="324" y="30" width="32" height="3" rx="1" fill="#253652"/>
  <rect x="324" y="35" width="28" height="3" rx="1" fill="#e8e0d0"/>
  <rect x="324" y="40" width="24" height="3" rx="1" fill="#253652"/>

  <!-- Gold stars -->
  <text x="18" y="30" font-family="Arial,sans-serif" font-size="16" fill="#c9a84c" opacity="0.45">★</text>
  <text x="350" y="188" font-family="Arial,sans-serif" font-size="14" fill="#c9a84c" opacity="0.4">★</text>
</svg>
