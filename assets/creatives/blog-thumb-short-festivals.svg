<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Film festival trophy with submission envelopes and celebrating characters illustration">
  <rect width="380" height="200" fill="#0d1b2a"/>
  <!-- Depth circles -->
  <circle cx="185" cy="100" r="130" fill="#162032" fill-opacity="0.6"/>
  <circle cx="330" cy="40" r="70" fill="#1e2f45" fill-opacity="0.45"/>
  <!-- Radial glow -->
  <circle cx="185" cy="95" r="95" fill="#c9a84c" fill-opacity="0.06"/>

  <!-- Trophy (center) -->
  <!-- Base plate -->
  <rect x="155" y="160" width="60" height="10" rx="4" fill="#c9a84c"/>
  <!-- Stem -->
  <rect x="176" y="140" width="18" height="22" rx="3" fill="#c9a84c"/>
  <!-- Cup body -->
  <path d="M140 62 L140 138 Q140 158 185 158 Q230 158 230 138 L230 62 Z" fill="none" stroke="#c9a84c" stroke-width="6" stroke-linejoin="round"/>
  <line x1="140" y1="62" x2="230" y2="62" stroke="#c9a84c" stroke-width="6" stroke-linecap="round"/>
  <!-- Handles -->
  <path d="M140 78 Q116 78 116 108 Q116 138 140 138" stroke="#c9a84c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <path d="M230 78 Q254 78 254 108 Q254 138 230 138" stroke="#c9a84c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- Film reel wrapped around base -->
  <circle cx="185" cy="152" r="10" fill="none" stroke="#c9a84c" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="185" cy="152" r="4" fill="#c9a84c" fill-opacity="0.5"/>
  <!-- Star inside cup -->
  <text x="170" y="120" fill="#162032" font-size="22" font-weight="900">★</text>
  <!-- Gold shimmer lines on cup -->
  <line x1="160" y1="90" x2="160" y2="130" stroke="#e8c96a" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="175" y1="80" x2="175" y2="148" stroke="#e8c96a" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Floating submission envelopes -->
  <!-- Envelope left (tilted) -->
  <g transform="rotate(-15 76 72)">
    <rect x="52" y="58" width="48" height="34" rx="3" fill="#1e2f45" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M52 58 L76 76 L100 58" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="68" width="20" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="60" y="73" width="14" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
  </g>
  <!-- Envelope right (tilted) -->
  <g transform="rotate(12 298 68)">
    <rect x="274" y="52" width="48" height="34" rx="3" fill="#1e2f45" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M274 52 L298 70 L322 52" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="282" y="62" width="20" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
    <rect x="282" y="67" width="14" height="2" rx="1" fill="#3d5166" opacity="0.5"/>
  </g>
  <!-- Small envelope (floating top) -->
  <g transform="rotate(5 192 24)">
    <rect x="174" y="16" width="36" height="24" rx="2" fill="#1e2f45" stroke="#e8c96a" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M174 16 L192 28 L210 16" fill="none" stroke="#e8c96a" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Left celebrating character -->
  <rect x="30" y="138" width="44" height="44" rx="11" fill="#2c3e50"/>
  <circle cx="52" cy="126" r="17" fill="#d4956a"/>
  <path d="M35 121 Q38 107 52 105 Q66 107 69 121 Q63 112 52 110 Q41 112 35 121Z" fill="#5d3a1a"/>
  <!-- Arm up left -->
  <path d="M34 148 Q18 132 10 118" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="10" cy="118" r="7" fill="#d4956a"/>
  <!-- Arm up right -->
  <path d="M70 148 Q84 132 90 118" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="118" r="7" fill="#d4956a"/>
  <path d="M44 181 L40 200" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 181 L64 200" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Right celebrating character -->
  <rect x="306" y="138" width="44" height="44" rx="11" fill="#c0533a"/>
  <circle cx="328" cy="126" r="17" fill="#d4956a"/>
  <path d="M311 121 Q314 107 328 105 Q342 107 345 121 Q339 112 328 110 Q317 112 311 121Z" fill="#3d2b1f"/>
  <path d="M310 148 Q294 132 286 118" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="286" cy="118" r="7" fill="#d4956a"/>
  <path d="M346 148 Q360 132 368 118" stroke="#d4956a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="368" cy="118" r="7" fill="#d4956a"/>
  <path d="M320 181 L316 200" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M336 181 L340 200" stroke="#d4956a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Confetti -->
  <rect x="100" y="30" width="8" height="5" rx="1.5" fill="#c9a84c" transform="rotate(-22 100 30)"/>
  <rect x="258" y="26" width="8" height="5" rx="1.5" fill="#c0533a" transform="rotate(18 258 26)"/>
  <circle cx="124" cy="18" r="4" fill="#2a7f7f" opacity="0.7"/>
  <circle cx="242" cy="14" r="3" fill="#c9a84c" opacity="0.7"/>
  <circle cx="70" cy="180" r="3" fill="#e8c96a" opacity="0.55"/>
  <circle cx="300" cy="178" r="4" fill="#c9a84c" opacity="0.5"/>

  <!-- Stars -->
  <text x="112" y="44" fill="#c9a84c" font-size="13" opacity="0.45">★</text>
  <text x="14" y="180" fill="#c9a84c" font-size="11" opacity="0.42">★</text>
</svg>
