<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- Background -->
  <rect width="380" height="200" fill="#162032"/>
  <!-- Depth circles -->
  <circle cx="300" cy="160" r="130" fill="#1e2f45" opacity="0.6"/>
  <circle cx="50" cy="30" r="80" fill="#0d1b2a" opacity="0.7"/>
  <!-- Glow behind page -->
  <circle cx="190" cy="100" r="80" fill="#c9a84c" opacity="0.05"/>

  <!-- A4 script page (portrait, center) -->
  <rect x="108" y="18" width="164" height="168" rx="6" fill="#f5f0e8"/>

  <!-- Slugline (gold rect) -->
  <rect x="118" y="32" width="144" height="10" rx="3" fill="#c9a84c" opacity="0.8"/>
  <!-- Action lines -->
  <rect x="118" y="48" width="140" height="5" rx="2" fill="#253652" opacity="0.25"/>
  <rect x="118" y="56" width="120" height="5" rx="2" fill="#253652" opacity="0.25"/>
  <rect x="118" y="64" width="134" height="5" rx="2" fill="#253652" opacity="0.25"/>
  <!-- Character name (centred, short) -->
  <rect x="158" y="78" width="64" height="6" rx="2" fill="#2c3e50" opacity="0.4"/>
  <!-- Dialogue indented lines -->
  <rect x="132" y="88" width="116" height="5" rx="2" fill="#253652" opacity="0.22"/>
  <rect x="132" y="96" width="100" height="5" rx="2" fill="#253652" opacity="0.22"/>
  <rect x="132" y="104" width="108" height="5" rx="2" fill="#253652" opacity="0.22"/>
  <!-- More action -->
  <rect x="118" y="118" width="130" height="5" rx="2" fill="#253652" opacity="0.2"/>
  <rect x="118" y="126" width="144" height="5" rx="2" fill="#253652" opacity="0.2"/>
  <rect x="118" y="134" width="110" height="5" rx="2" fill="#253652" opacity="0.2"/>
  <!-- Final dialogue line -->
  <rect x="158" y="146" width="64" height="6" rx="2" fill="#2c3e50" opacity="0.35"/>
  <rect x="132" y="156" width="116" height="5" rx="2" fill="#253652" opacity="0.2"/>
  <rect x="132" y="164" width="90" height="5" rx="2" fill="#253652" opacity="0.2"/>

  <!-- Large "1" numeral overlaid on page -->
  <text x="190" y="125" font-family="Georgia,serif" font-size="80" fill="#c9a84c" text-anchor="middle" opacity="0.12" font-weight="bold">1</text>

  <!-- "1 PAGE" badge -->
  <rect x="218" y="174" width="44" height="14" rx="6" fill="#c9a84c"/>
  <text x="240" y="184" font-family="Arial,sans-serif" font-size="8" fill="#0d1b2a" text-anchor="middle" font-weight="bold">1 PAGE</text>

  <!-- Writer character beside page (left) -->
  <!-- Body -->
  <rect x="44" y="108" width="28" height="38" rx="12" fill="#2a7f7f"/>
  <!-- Legs -->
  <rect x="48" y="142" width="9" height="20" rx="4" fill="#1e2f45"/>
  <rect x="60" y="142" width="9" height="20" rx="4" fill="#1e2f45"/>
  <!-- Head -->
  <circle cx="58" cy="100" r="14" fill="#d4956a"/>
  <!-- Hair -->
  <path d="M44 95 Q58 81 72 95 L72 88 Q58 74 44 88 Z" fill="#162032"/>
  <!-- Eye (looking at page) -->
  <circle cx="63" cy="101" r="2.5" fill="#0d1b2a"/>
  <!-- Arm pointing at page with pen -->
  <path d="M72 118 Q88 112 102 108" stroke="#d4956a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Pen in hand -->
  <rect x="100" y="102" width="3" height="14" rx="1.5" fill="#f5f0e8" transform="rotate(-20 101 109)"/>
  <!-- Other arm (behind back) -->
  <path d="M44 118 Q34 124 28 130" stroke="#d4956a" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Small film reel background corner (bottom right) -->
  <!-- Outer ring -->
  <circle cx="348" cy="170" r="22" fill="#253652"/>
  <circle cx="348" cy="170" r="19" fill="#162032"/>
  <!-- Hub -->
  <circle cx="348" cy="170" r="7" fill="#253652"/>
  <circle cx="348" cy="170" r="3.5" fill="#0d1b2a"/>
  <!-- Spokes (4) -->
  <line x1="348" y1="163" x2="348" y2="151" stroke="#253652" stroke-width="5"/>
  <line x1="348" y1="177" x2="348" y2="189" stroke="#253652" stroke-width="5"/>
  <line x1="341" y1="166" x2="331" y2="160" stroke="#253652" stroke-width="5"/>
  <line x1="355" y1="174" x2="365" y2="180" stroke="#253652" stroke-width="5"/>

  <!-- Gold stars -->
  <text x="16" y="28" font-family="Arial,sans-serif" font-size="16" fill="#c9a84c" opacity="0.45">★</text>
  <text x="72" y="192" font-family="Arial,sans-serif" font-size="14" fill="#c9a84c" opacity="0.4">★</text>
</svg>
