<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Loop Game</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/game.css">
    
    <!-- JavaScript Dependencies -->
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Game Logic -->
    <script src="../assets/js/game.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Drum Beats</h2>
      <div class="beat-list" id="beat-list">
        <!-- Beat list will be populated by JavaScript -->
      </div>
    </div>
    
    <div class="main-content">
      <h1>Recreate This Drum Beat</h1>
      <div class="beat-info">
        <h3 id="current-beat-name">Loading...</h3>
        <span id="current-beat-bpm"></span>
        <div id="debug-info" class="debug-info">
          <div>BPM: <span id="debug-bpm">-</span></div>
          <div>Bars: <span id="debug-bars">-</span></div>
          <div>MIDI Notes: <span id="debug-midi-notes">-</span></div>
          <div>Loop Duration: <span id="debug-duration">-</span> seconds</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary" onclick="playReferencePattern()">Play Reference Beat</button>
      </div>

      <div id="piano-roll"></div>

      <div class="controls">
        <button class="btn" onclick="playUserPattern()">Play Your Version</button>
        <button class="btn" onclick="checkUserAccuracy()">Check Your Accuracy</button>
        <button class="btn solution" onclick="showSolution()">Show Solution</button>
      </div>

      <div id="status" class="status"></div>
    </div>
  </div>
</body>
</html>
