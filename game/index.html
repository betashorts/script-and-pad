<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Loop Recreation Game</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/game.css">
    
    <!-- JavaScript Dependencies -->
    <script src="../assets/js/tone.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
    
    <!-- Game Logic -->
    <script src="../assets/js/game.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Drum Beats</h2>
      <div id="beat-list"></div>
    </div>
    
    <div class="main-content">
      <h1>Recreate This Drum Beat</h1>
      <div class="beat-info">
        <h2 id="current-beat-name">Basic Rock Beat</h2>
        <div id="current-beat-bpm">100 BPM</div>
      </div>

      <div id="piano-roll"></div>

      <div class="controls">
        <button id="playReference" class="btn">Play Reference Beat</button>
        <button id="playUser" class="btn">Play Your Version</button>
        <button id="checkAccuracy" class="btn">Check Accuracy</button>
        <button id="toggleSolution" class="btn">Show/Hide Solution</button>
      </div>

      <div id="status" class="status">Ready to play!</div>

      <div id="debug-info" class="debug-info">
        <div>BPM: <span id="debug-bpm">-</span></div>
        <div>Time Signature: <span id="debug-time-signature">-</span></div>
        <div>Bars: <span id="debug-bars">-</span></div>
        <div>Duration: <span id="debug-duration">-</span>s</div>
        <div>MIDI Notes: <span id="debug-midi-notes">-</span></div>
      </div>
    </div>
  </div>
</body>
</html>
