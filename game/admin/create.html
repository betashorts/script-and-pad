<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Custom Pattern</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../../../assets/css/admin/create.css">
    
    <!-- JavaScript Dependencies -->
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="../../../assets/js/admin/create.js" type="module" defer></script>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <h2>Instruments</h2>
            <div id="instrument-list"></div>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1>Create Custom Pattern</h1>
            </div>
            
            <div class="controls">
                <div class="bpm-control">
                    <label for="bpm">BPM:</label>
                    <input type="number" id="bpm" value="120" min="40" max="300">
                </div>
                <div class="control-buttons">
                    <button id="playPattern" class="btn primary">Play Pattern</button>
                    <button id="downloadPattern" class="btn">Download MIDI</button>
                </div>
            </div>

            <div id="piano-roll" class="piano-roll"></div>

            <div id="status" class="status">Ready to create!</div>
        </div>
    </div>
</body>
</html>
