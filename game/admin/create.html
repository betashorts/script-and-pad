---
layout: default
title: Create Custom Pattern
---

<link rel="stylesheet" href="/assets/game/css/create.css">

<div class="game-container admin-container">
    <div class="sidebar">
        <h2>Instruments</h2>
        <div id="instrument-list"></div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>Create Custom Pattern</h1>
        </div>
        
        <div class="controls">
            <div class="bpm-control">
                <label for="bpm">BPM:</label>
                <input type="number" id="bpm" value="120" min="40" max="300">
            </div>
            <div class="control-buttons">
                <button id="playPattern" class="btn primary">Play Pattern</button>
                <button id="downloadPattern" class="btn">Download MIDI</button>
            </div>
        </div>

        <div id="piano-roll" class="piano-roll"></div>

        <div id="status" class="status">Ready to create!</div>
    </div>
</div>

<!-- JavaScript Dependencies -->
<script src="https://unpkg.com/@tonejs/midi"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="/assets/game/js/create.js" type="module" defer></script>
