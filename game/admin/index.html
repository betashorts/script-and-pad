    <main>
        <link rel="stylesheet" href="/assets/game/css/admin.css">

<div class="game-container admin-container">
    <h1>MIDI Pattern Analysis</h1>
    
    <!-- File Upload Section -->
    <div class="upload-section">
        <input type="file" id="midiFileInput" accept=".mid,.midi">
        <button id="uploadButton">Analyze MIDI</button>
    </div>

    <!-- MIDI Info Display -->
    <div class="midi-info">
        <h2>MIDI File Information</h2>
        <div class="info-grid">
            <div class="info-item">
                <label>BPM:</label>
                <span id="bpm-display">-</span>
            </div>
            <div class="info-item">
                <label>Time Signature:</label>
                <span id="time-signature-display">-</span>
            </div>
            <div class="info-item">
                <label>Total Bars:</label>
                <span id="total-bars-display">-</span>
            </div>
            <div class="info-item">
                <label>Duration:</label>
                <span id="duration-display">-</span>
            </div>
            <div class="info-item">
                <label>MIDI Notes:</label>
                <span id="midi-notes-display">-</span>
            </div>
        </div>
    </div>

    <!-- Patterns Display -->
    <div class="patterns-container">
        <h2>Bar Patterns</h2>
        <div id="bar-patterns"></div>
    </div>

    <!-- Grouped MIDI Patterns Section -->
    <div class="patterns-container">
        <h2>Grouped MIDI Patterns (by Pattern Signature)</h2>
        <div id="grouped-midi-patterns"></div>
    </div>
</div>

<!-- JavaScript Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
